        function updateDashboard(subject) {
            document.getElementById('selectedSubjectBadge').innerText = subject ? `Filtered: ${subject}` : "All Subjects";

            // Update Timeline Chart

            filteredTimeline.forEach(d => {
                if (!timelineSum[d.year]) timelineSum[d.year] = { articles: 0, citations: 0 };

                timelineSum[d.year].citations += d.total_citations;
